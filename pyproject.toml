[project]
name = "fast-mcp-confluence"
version = "0.1.0"
description = "Fast MCP server for Atlassian Confluence Cloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.4,<4.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "aiosqlite>=0.19.0,<1.0.0",
    "bleach>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
encryption = [
    "sqlcipher3-binary>=0.5.0,<1.0.0",
]

[project.scripts]
fast-mcp-confluence = "fast_mcp_confluence.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_mcp_confluence"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
